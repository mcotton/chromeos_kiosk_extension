name: secret-scan

# The pre-commit hook is skippable (--no-verify) and is not installed by a fresh
# clone. This job is neither. It is the control that actually holds.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --all mode needs the whole history

      - name: Self-test the scanner
        # If the rules regress, every later step is worthless.
        run: ./scripts/test-scan-secrets.sh

      - name: Scan pushed range
        if: github.event_name == 'pull_request'
        run: |
          ./scripts/scan-secrets.sh --range "origin/${{ github.base_ref }}...HEAD"

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: ./scripts/scan-secrets.sh --all

      - name: Verify no credentials are packed into the published .crx
        # The .crx files in docs/ are what every kiosk downloads. Whatever is
        # inside them is effectively published to the fleet and to the world,
        # so assert the payload is exactly the three source files and nothing
        # else - no stray policy dump, no key, no test fixture.
        run: |
          python3 - <<'PY'
          import glob, io, sys, zipfile
          ALLOWED = {"manifest.json", "schema.json", "content.js"}
          bad = False
          for path in sorted(glob.glob("docs/*.crx")):
              blob = open(path, "rb").read()
              start = blob.find(b"PK\x03\x04")
              if start < 0:
                  print(f"BLOCKED {path}: no zip payload found")
                  bad = True
                  continue
              zf = zipfile.ZipFile(io.BytesIO(blob[start:]))
              names = {n.filename for n in zf.infolist()}
              extra = names - ALLOWED
              if extra:
                  print(f"BLOCKED {path}: unexpected files packed: {sorted(extra)}")
                  bad = True
                  continue
              for name in names:
                  text = zf.read(name).decode("utf-8", "replace")
                  for needle in ("BEGIN RSA PRIVATE KEY", "BEGIN PRIVATE KEY",
                                 "@een.com", "@eagleeyenetworks.com"):
                      if needle in text:
                          print(f"BLOCKED {path}:{name} contains {needle!r}")
                          bad = True
              print(f"ok {path}: {sorted(names)}")
          sys.exit(1 if bad else 0)
          PY
